name: 8 PM Lab Check

on:
  schedule:
    # 14:30 UTC = 8:00 PM IST (India Standard Time, UTC+5:30). No DST adjustment needed.
    # If your labs are in a different timezone, change this to (8 PM in your zone) - (your UTC offset).
    - cron: "30 14 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab, for testing

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: notifications
        run: npm install

      - name: Run 8 PM lab check
        working-directory: notifications
        run: node send-alerts.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
